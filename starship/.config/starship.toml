palette = "grey"

# ── Main Format Layout ─────────────────────────────────────────────
format = """
$username\
$hostname\
$directory \
$fill \
[$all](grey)\
$conda\
$time\
$line_break\
$character"""

# Enable instant async rendering for heavy modules
add_newline = false

# ── Shell interaction ──────────────────────────────────────────────
[character]
success_symbol = "[@](bold green)"
error_symbol = "[@](bold red)"

[fill]
symbol = '─'
style = '#222222'

# ── Context modules ────────────────────────────────────────────────
[username]
style_user = "grey"
style_root = "bold grey"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = true
style = "grey"
format = "@[$hostname]($style) "
disabled = false

[directory]
truncation_length = 4
truncate_to_repo = true
style = "grey"
format = "[$path]($style)"
# Skip scanning massive repos or slow networks for speed
repo_root_style = "bold grey"

# ── Conda / Mamba Environment ─────────────────────────────────────
[conda]
symbol = "🅒 "
style = "grey"
format = "via [$symbol$environment]($style) "
ignore_base = false

# ── Time ────────────────────────────────────────────────────────────
[time]
disabled = false
time_format = "%T"
style = "#444444"
format = '[$time]($style)'

# ── Command duration ──────────────────────────────────────────────
[cmd_duration]
min_time = 10000
style = "grey"
format = "[⏱ $duration]($style)"

# ── Git modules ────────────────────────────────────────────────────
[git_branch]
symbol = "git "
style = "grey"
format = "[$symbol$branch]($style) "

[git_status]
style = "grey"
format = '([$all_status$ahead_behind]($style) )'

# ── Language runtimes ──────────────────────────────────────────────
[nodejs]
symbol = "node "
style = "grey"
format = "[$symbol($version )]($style)"

[rust]
symbol = "rs "
style = "grey"
format = "[$symbol($version )]($style)"

[golang]
symbol = "go "
style = "grey"
format = "[$symbol($version )]($style)"

[python]
symbol = "py "
style = "grey"
format = "[$symbol($version )]($style)"

# ── Cloud / DevOps ────────────────────────────────────────────────
[aws]
symbol = "aws "
style = "grey"
format = "[$symbol($profile )]($style)"

[gcloud]
symbol = "gcp "
style = "grey"
format = "[$symbol($active )]($style)"

[kubernetes]
symbol = "k8s "
style = "grey"
format = '[$symbol\($context\)]($style)'

[terraform]
symbol = "tf "
style = "grey"
format = "[$symbol($workspace)]($style)"

# ── Package management ────────────────────────────────────────────
[package]
symbol = "package "
style = "grey"
format = "[$symbol$version]($style)"

# ── System modules ────────────────────────────────────────────────
[jobs]
symbol = "⚙ "
style = "grey"
format = "[$symbol$number]($style)"
threshold = 1

[memory_usage]
disabled = true

[battery]
disabled = true

[shlvl]
style = "grey"
format = "[$shlvl]($style)"
threshold = 2

# ── Palette (Centralized color mapping) ─────────────────────────
[palettes.grey]
grey = "#777777"
