<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#1e1e20"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#414143"/>
      <stop offset="1" stop-color="#505052"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="480" height="270" fill="url(#background)"/>
  
  <!-- Progress bar background -->
  <rect x="140" y="185" width="200" height="4" rx="2" fill="#28282a"/>
  
  <!-- Progress bar -->
  <rect x="140" y="185" width="0" height="4" rx="2" fill="url(#progress)">
    <animate attributeName="width" from="0" to="200" dur="2s" fill="freeze"/>
  </rect>
  
  <!-- Text -->
  <text x="240" y="170" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="300" fill="#aaaaac" opacity="0.8">Noir</text>
</svg>
